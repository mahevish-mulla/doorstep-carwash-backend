spring.application.name=bookingService

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/carwash_booking_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#this value should match the user service ,else token validation fails

jwt.secret=this-is-a-dev-only-secret-change-me-before-deploying-must-be-32chars-min
jwt.expiration-ms=86400000